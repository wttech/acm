name: Test

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true
      AWS_S3_BUCKET_NAME:
        required: true

jobs:
  build:
    name: 'Build ACM Package'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        if: always()
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build Code
        run: mvn -B clean package verify

      - name: Upload ACM Package Artifact
        uses: actions/upload-artifact@v7
        with:
          name: acm-package
          path: all/target/*.zip
          retention-days: 3

      - name: Upload ACM Content Example Package Artifact
        uses: actions/upload-artifact@v7
        with:
          name: acm-content-example
          path: ui.content.example/target/*.zip
          retention-days: 3

  test:
    name: 'Test ACM Package (AEM ${{ matrix.aem }})'
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - aem: '6.5.0'
            quickstart_prefix: 'cq-quickstart-6.5.0.jar'
            java_download_url: 'https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u432-b06/OpenJDK8U-jdk_x64_linux_hotspot_8u432b06.tar.gz'
          - aem: '6.6.x'
            quickstart_prefix: 'cq-quickstart-6.6.'
            java_download_url: 'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21%2B35/OpenJDK21U-jdk_x64_linux_hotspot_21_35.tar.gz'
    permissions:
      contents: read
      actions: read
      checks: write
    env:
      AEM_OUTPUT_LOG_MODE: none
      AEM_VENDOR_JAVA_DOWNLOAD_URL: ${{ matrix.java_download_url }}
      FORCE_COLOR: 1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Setup NodeJS Runtime
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: './test/e2e/package-lock.json'

      - name: Setup NodeJS Dependencies
        working-directory: ./test/e2e
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./test/e2e
        run: npx playwright install --with-deps chromium

      - name: Download ACM Package Artifact
        uses: actions/download-artifact@v8
        with:
          name: acm-package
          path: ./aem/home/lib/acm

      - name: Download ACM Content Example Artifact
        uses: actions/download-artifact@v8
        with:
          name: acm-content-example
          path: ./aem/home/lib/acm-content-example

      - name: Setup AEM Instance
        run: |
          set -e
          echo "Preparing AEM instance"
          echo "AEM_PUBLISH_ACTIVE=false" >> .env
          mkdir -p aem/home/lib
          JAR_FILE=$(aws s3 ls "s3://${{ secrets.AWS_S3_BUCKET_NAME }}/aem/on-prem/${{ matrix.quickstart_prefix }}" | awk '{print $4}' | sort -V | tail -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "::error::No AEM quickstart matching '${{ matrix.quickstart_prefix }}' found in S3!"
            exit 1
          fi
          echo "Downloading AEM quickstart '$JAR_FILE'"
          aws s3 cp --no-progress --only-show-errors "s3://${{ secrets.AWS_S3_BUCKET_NAME }}/aem/on-prem/$JAR_FILE" "aem/home/lib/$JAR_FILE"
          aws s3 cp --no-progress --only-show-errors s3://${{ secrets.AWS_S3_BUCKET_NAME }}/aem/on-prem/license.properties aem/home/lib/license.properties
          echo "Prepared AEM instance"
          echo "Launching AEM instance"
          sh aemw instance launch
          echo "Launched AEM instance"

      - name: Deploy ACM Package
        run: |
          PACKAGE_PATH=$(find ./aem/home/lib/acm -name "*.zip" | head -1)
          echo "Deploying ACM Package '$PACKAGE_PATH'"
          sh aemw pkg deploy --file "$PACKAGE_PATH"
          echo "Restarting AEM instance to apply repoinit scripts"
          sh aemw instance restart
          echo "Deployed ACM Package '$PACKAGE_PATH'"

      - name: Deploy ACM Content Example Package
        run: |
          PACKAGE_PATH=$(find ./aem/home/lib/acm-content-example -name "*.zip" | head -1)
          echo "Deploying ACM Content Example Package '$PACKAGE_PATH'"
          sh aemw pkg deploy --file "$PACKAGE_PATH"
          echo "Deployed ACM Content Example Package '$PACKAGE_PATH'"

      - name: Run Playwright Tests
        working-directory: ./test/e2e
        run: npx playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: acm-playwright-report-${{ matrix.aem }}
          path: ./test/e2e/playwright-report/
          retention-days: 30