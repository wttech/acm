name: Check

on:
  push:
    branches: [ main ]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [ main ]
    paths-ignore: ['**.md', 'docs/**']

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      acm: ${{ steps.filter.outputs.acm }}
      mcp-server: ${{ steps.filter.outputs.mcp-server }}
      vscode-extension: ${{ steps.filter.outputs.vscode-extension }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # Every pattern of a filter must match, so each filter has a single positive pattern.
          predicate-quantifier: every
          filters: |
            acm:
              - '**'
              - '!tools/**'
            mcp-server: 'tools/{mcp-server,shared,skills}/**'
            vscode-extension: 'tools/{vscode-extension,mcp-server,shared,skills}/**'
            workflow: '.github/workflows/check.yml'

  codegen:
    name: Codegen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Generated Script API Is Up To Date
        run: |
          node tools/shared/codegen.mjs
          git diff --exit-code -- tools || {
            echo "::error::The ACM script API changed. Run 'node tools/shared/codegen.mjs' (or build ui.frontend) and commit the result."
            exit 1
          }

  acm:
    name: ACM
    needs: changes
    if: needs.changes.outputs.acm == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        if: always()
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build Code
        run: mvn -B clean package verify

  mcp-server:
    name: MCP Server (Node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.mcp-server == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ 22, 24 ]
    defaults:
      run:
        working-directory: tools/mcp-server
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: tools/mcp-server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build & Test
        run: npm test

  vscode-extension:
    name: VS Code Extension
    needs: changes
    if: needs.changes.outputs.vscode-extension == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/vscode-extension
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/vscode-extension/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: xvfb-run -a npm test

      - name: Package
        run: npm run package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: acm-vscode-extension
          path: tools/vscode-extension/dist/*.vsix
          retention-days: 14
