name: Release - VS Code Extension

# PR/main checks live in check.yml.
on:
  push:
    tags: [ 'vscode-extension-v*' ]

defaults:
  run:
    working-directory: tools/vscode-extension

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/vscode-extension/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check Manifest
        run: npm run check:manifest

      - name: Test
        run: xvfb-run -a npm test

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/vscode-extension/package-lock.json

      - name: Check Versions Match Tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/vscode-extension-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          LOCK_VERSION=$(node -p "require('./package-lock.json').version")
          echo "tag=$TAG_VERSION package.json=$PKG_VERSION package-lock.json=$LOCK_VERSION"
          test "$TAG_VERSION" = "$PKG_VERSION"
          test "$TAG_VERSION" = "$LOCK_VERSION"
          echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: npm ci

      - name: Package
        run: npm run package

      # Not marked as latest, so the ACM release stays the repository's latest release.
      - name: Create GitHub Release
        run: |
          gh release create "vscode-extension-v${VERSION}" \
            --title "VS Code Extension ${VERSION}" \
            --notes "Install: download the .vsix below, then run 'Extensions: Install from VSIX...' in VS Code." \
            --latest=false \
            "dist/acm-${VERSION}.vsix"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Marketplace trusted publishing is not live yet (https://github.com/microsoft/vsmarketplace/issues/1422), so a failure
      # only warns and the .vsix of the GitHub release is uploaded by hand. vsce 4.0.0 omits the api-version of the
      # OIDC exchange; 4.0.1-3 fixes it. Use the locked vsce again once 4.0.1 is out.
      - name: Publish to VS Code Marketplace
        id: marketplace
        continue-on-error: true
        run: npx --yes @vscode/vsce@4.0.1-3 publish --oidc --packagePath "dist/acm-${VERSION}.vsix"

      # Trusted publishing: Open VSX exchanges the workflow's OIDC token for a short-lived token.
      - name: Publish to Open VSX
        id: openvsx
        continue-on-error: true
        run: npx ovsx publish --trusted-publishing "dist/acm-${VERSION}.vsix"

      - name: Report Manual Publishing
        if: steps.marketplace.outcome == 'failure' || steps.openvsx.outcome == 'failure'
        run: |
          if [ "${{ steps.marketplace.outcome }}" = "failure" ]; then
            echo "::warning title=VS Code Marketplace::Not published. Trusted publishing is not supported by the Marketplace yet (https://github.com/microsoft/vsmarketplace/issues/1422). Upload acm-${VERSION}.vsix from the GitHub release at https://marketplace.visualstudio.com/manage/publishers/wppes"
          fi
          if [ "${{ steps.openvsx.outcome }}" = "failure" ]; then
            echo "::warning title=Open VSX::Not published. Check the trusted publisher of the namespace (https://github.com/eclipse-openvsx/openvsx/wiki/Trusted-Publishing) or upload acm-${VERSION}.vsix from the GitHub release at https://open-vsx.org/user-settings/extensions"
          fi
